name: Veille appels d'offres France (BOAMP/APProch/PLACE)

# Reutilise les secrets GDRIVE_SA_KEY_JSON et GEMINI_API_KEY deja
# configures pour le workflow de sourcing (meme compte de service, meme
# cle Gemini) — seul GDRIVE_FOLDER_ID_FRANCE est nouveau (dossier Drive
# "DCE_des_offres", distinct de celui du sourcing).
#
# Pas d'envoi de mail pour ce projet (demande explicite).
#
# `schedule` desactive par defaut (commente) tant que GDRIVE_FOLDER_ID_FRANCE
# n'est pas configure et qu'un declenchement manuel n'a pas ete verifie vert.
on:
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: appel-offres-france

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: appel-offres-france/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Installer Chromium (Playwright, pour le téléchargement des DCE et PLACE)
        run: playwright install --with-deps chromium

      - name: "Run complet (sync Drive + collecte + téléchargement DCE + synthèse)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_FRANCE }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python run_cloud.py

      - name: Journaux en cas d'échec
        if: failure()
        run: echo "Le run a échoué — voir les logs de l'étape précédente pour le détail."
