name: Veille appels d'offres Afrique (Côte d'Ivoire / Maroc)

# Reutilise le secret GDRIVE_SA_KEY_JSON deja configure pour le workflow de
# sourcing (meme compte de service) — seul GDRIVE_FOLDER_ID_AFRIQUE est
# nouveau (dossier Drive "Maroc-CI DCE_des_offres"). Pas de cle Gemini
# necessaire : ce projet n'utilise pas de synthese IA.
#
# Pas d'envoi de mail pour ce projet (demande explicite).
#
# `schedule` desactive par defaut (commente) tant que GDRIVE_FOLDER_ID_AFRIQUE
# n'est pas configure et qu'un declenchement manuel n'a pas ete verifie vert.
on:
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: appel-offres-afrique

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: appel-offres-afrique/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Installer Chromium (Playwright, pour la source Maroc)
        run: playwright install --with-deps chromium

      - name: "Run complet (sync Drive + collecte)"
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_AFRIQUE }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python run_cloud.py

      - name: Journaux en cas d'échec
        if: failure()
        run: echo "Le run a échoué — voir les logs de l'étape précédente pour le détail."
